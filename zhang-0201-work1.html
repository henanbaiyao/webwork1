<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>爱心网页</title>
    <style>
        * { margin: 0; padding: 0; }
        body { 
            background: #fce4ec; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: 'Arial', sans-serif;
        }
        .heart {
            width: 100px;
            height: 100px;
            background: #e91e63;
            position: relative;
            transform: rotate(45deg);
            animation: beat 1s infinite alternate;
            margin-bottom: 30px;
        }
        .heart::before, .heart::after {
            content: '';
            width: 100px;
            height: 100px;
            background: #e91e63;
            border-radius: 50%;
            position: absolute;
        }
        .heart::before { top: -50px; left: 0; }
        .heart::after { top: 0; left: -50px; }
        @keyframes beat {
            0% { transform: rotate(45deg) scale(1); }
            100% { transform: rotate(45deg) scale(1.2); }
        }
        .text {
            color: #c2185b;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="hearts-bg" id="heartsBg"></div>
    <div class="heart"></div>
    <div class="text">
        <br>
        
    </div>

    <script>
        // 动态生成爱心背景
        function createHeart() {
            const heart = document.createElement('div');
            heart.style.width = `${Math.random()*20 + 10}px`;
            heart.style.height = `${Math.random()*20 + 10}px`;
            heart.style.background = `rgba(233, 30, 99, ${Math.random()*0.5 + 0.3})`;
            heart.style.position = 'absolute';
            heart.style.transform = 'rotate(45deg)';
            heart.style.left = `${Math.random()*100}vw`;
            heart.style.top = '-50px';
            heart.style.animation = `fall ${Math.random()*3 + 2}s linear infinite`;
            
            document.getElementById('heartsBg').appendChild(heart);
            
            // 移除超出屏幕的爱心
            setTimeout(() => heart.remove(), 5000);
        }

        // 定义下落动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                0% { transform: rotate(45deg) translateY(0); opacity: 1; }
                100% { transform: rotate(45deg) translateY(100vh); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // 定时生成爱心
        setInterval(createHeart, 300);
    </script>
</body>
</html>
